<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Champion Habit Tracker - Workout</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

<div class="container">

    <button
        type="button"
        onclick="history.back()"
        class="back-button"
        aria-label="Go back">
        ←
    </button>

    <h1 id="workoutTitle">
        🏋️ Workout
    </h1>

    <p id="workoutDescription">
        Choose your workout plan
    </p>

    <hr>

    <h2 id="selectedGoal">
        💪 Workout Plan
    </h2>

    <p id="goalDescription"></p>

    <div id="workoutPlan"></div>

</div>

<script src="workout.js"></script>

</body>
</html>
