<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Champion Habit Tracker - History</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <!-- =====================================
             HEADER
        ====================================== -->

        <h1>
            🏆 Champion Habit Tracker
        </h1>


        <h2 id="welcomeText">
            Welcome 👋
        </h2>


        <hr>


        <!-- =====================================
             REPORT HISTORY
        ====================================== -->

        <h2>
            📅 Report History
        </h2>


        <div id="historyList">

            <!-- Reports will be loaded here -->

        </div>


        <hr>

       <!-- =====================================
     WEEKLY REPORT
====================================== -->

<div class="section-title">
    📊 WEEKLY REPORT
</div>

<div id="weeklyReport">

    <!-- WEEK NAVIGATION -->

    <div class="weekly-navigation">

        <button
            id="previousWeek"
            type="button">
            ◀ Previous Week
        </button>

        <strong id="weekTitle">
            Current Week
        </strong>

        <button
            id="nextWeek"
            type="button"
            disabled>
            Next Week ▶
        </button>

    </div>


    <!-- WEEKLY DAYS -->

    <div id="weeklyDays">
        <!-- Weekly data will appear here -->
    </div>


    <!-- WEEKLY AVERAGE -->

    <h3 id="weeklyAverage">
        📊 Weekly Average : 0%
    </h3>

</div>

    <!-- =====================================
     MONTHLY REPORT
====================================== -->

<div
    class="section-title"
    id="monthlyTitle">

    📅 MONTHLY REPORT

</div>

<div id="monthlyReport">

    <p>
        Select Month:
    </p>

    <select id="monthSelector">
        <option value="">
            Loading months...
        </option>
    </select>

    <div id="monthlyDays">
        <!-- Monthly reports appear here -->
    </div>

    <h3 id="monthlyAverage">
        📊 Monthly Average : 0%
    </h3>

</div>

</div>


        <!-- =====================================
             BACK TO CHECKLIST
        ====================================== -->

        <button
            onclick="window.location='checklist.html'">

            ⬅️ Back to Today's Checklist

        </button>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>
   <script>
alert("HISTORY PAGE LOADED");
</script>
</script>
</body>

</html>
