<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Champion Habit Tracker - History</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =====================================
           MONTH CALENDAR
        ===================================== */

        .calendar-container {
            margin-top: 20px;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }

        .calendar-header div {
            text-align: center;
            font-weight: bold;
            padding: 8px 2px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-day {
            min-height: 65px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: 0.2s;
        }

        .calendar-day:hover {
            transform: scale(1.03);
        }

        .calendar-day.empty {
            border: none;
            background: transparent;
            cursor: default;
        }

        .calendar-day.today {
            border: 2px solid #2196f3;
        }

        .calendar-day.has-report {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .calendar-day.no-report {
            background: #fafafa;
        }

        .calendar-date {
            font-size: 18px;
            font-weight: bold;
        }

        .calendar-progress {
            font-size: 12px;
            margin-top: 5px;
        }

        .calendar-dot {
            font-size: 11px;
            margin-top: 3px;
        }

        /* =====================================
           SELECTED DATE REPORT
        ===================================== */

        #selectedDateReport {
            margin-top: 20px;
        }

        .selected-date-card {
            padding: 18px;
            border-radius: 12px;
            background: #f5f5f5;
            border: 1px solid #ddd;
        }

        .selected-date-card progress {
            width: 100%;
        }

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .calendar-grid,
            .calendar-header {
                gap: 3px;
            }

            .calendar-day {
                min-height: 55px;
                padding: 4px;
            }

            .calendar-date {
                font-size: 15px;
            }

            .calendar-progress {
                font-size: 10px;
            }

            .calendar-dot {
                font-size: 9px;
            }

        }

    </style>

</head>


<body>

    <button
    class="back-button"
    onclick="history.back()"
    aria-label="Go back">
    ←
</button>

<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <h1>
        🏆 Champion Habit Tracker
    </h1>


    <h2 id="welcomeText">
        Welcome 👋
    </h2>


    <hr>


    <!-- =====================================
         DAILY REPORT HISTORY
    ====================================== -->

    <h2>
        📅 Report History
    </h2>


    <div id="historyList">

        <!-- Daily reports appear here -->

    </div>


    <hr>


    <!-- =====================================
         WEEKLY REPORT
    ====================================== -->

    <h2>
        📊 Weekly Report
    </h2>


    <!-- WEEK NAVIGATION -->

    <div class="weekly-navigation">

        <button
            id="previousWeek"
            type="button">

            ◀ Previous Week

        </button>


        <strong id="weekTitle">

            Current Week

        </strong>


        <button
            id="nextWeek"
            type="button"
            disabled>

            Next Week ▶

        </button>

    </div>


    <!-- WEEKLY DAYS -->

    <div id="weeklyDays">

        <!-- Weekly data appears here -->

    </div>


    <!-- WEEKLY AVERAGE -->

    <h3 id="weeklyAverage">

        📊 Weekly Average : 0%

    </h3>


    <hr>


    <!-- =====================================
         MONTHLY REPORT
    ====================================== -->

    <h2>
        📅 Monthly Report
    </h2>


    <p>
        Select Month:
    </p>


    <select id="monthSelector">

        <option value="">
            Loading months...
        </option>

    </select>


    <!-- =====================================
         CALENDAR
    ====================================== -->

    <div class="calendar-container">


        <!-- DAYS HEADER -->

        <div class="calendar-header">

            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

        </div>


        <!-- CALENDAR DATES -->

        <div id="monthlyCalendar"
             class="calendar-grid">

            <!-- Calendar generated by JavaScript -->

        </div>


    </div>


    <!-- =====================================
         MONTHLY AVERAGE
    ====================================== -->

    <h3 id="monthlyAverage">

        📊 Monthly Average : 0%

    </h3>


    <!-- =====================================
         SELECTED DATE REPORT
    ====================================== -->

    <div id="selectedDateReport">

        <!-- Selected date report appears here -->

    </div>


    <hr>


    <!-- =====================================
         BACK TO CHECKLIST
    ====================================== -->

    <button
        type="button"
        onclick="window.location='checklist.html'">

        ⬅️ Back to Today's Checklist

    </button>


</div>


<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="script.js"></script>


</body>

</html>
