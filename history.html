<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Champion Habit Tracker - History</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <!-- =====================================
             HEADER
        ====================================== -->

        <h1>
            🏆 Champion Habit Tracker
        </h1>


        <h2 id="welcomeText">
            Welcome 👋
        </h2>


        <hr>


        <!-- =====================================
             REPORT HISTORY
        ====================================== -->

        <h2>
            📅 Report History
        </h2>


        <div id="historyList">

            <!-- Reports will be loaded here -->

        </div>


        <hr>

        <!-- =====================================
     WEEKLY REPORT
====================================== -->

<hr>

<div class="section">

    <div class="section-title">
        📊 WEEKLY REPORT
    </div>

    <div id="weeklyReport">

        <p>
            📅 This Week
        </p>

        <div id="weeklyDays">
            <!-- Weekly data will appear here -->
        </div>

        <h3 id="weeklyAverage">
            📊 Weekly Average : 0%
        </h3>

    </div>

</div>


        <!-- =====================================
             BACK TO CHECKLIST
        ====================================== -->

        <button
            onclick="window.location='checklist.html'">

            ⬅️ Back to Today's Checklist

        </button>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    loadWeeklyReport();
});
</script>

</body>

</html>
